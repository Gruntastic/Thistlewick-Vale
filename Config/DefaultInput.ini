[/Script/Engine.InputSettings]
; Enhanced Input everywhere. Actions and mapping contexts are created in C++ at runtime (Net/TVInputConfig.cpp),
; so this file holds no key mappings. Property names checked against 5.8.3 InputSettings.h.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; MMO camera: cursor visible, viewport captures the mouse only while the right button is held (orbit).
DefaultViewportMouseCaptureMode=CaptureDuringRightMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bCaptureMouseOnLaunch=False
+ConsoleKeys=Tilde
